<text x="400.0" y="580.0" font-size="15" fill="#2b1d12" text-anchor="middle" direction="rtl" dominant-baseline="middle">جيب الغاية = الأصل + بُعد القطر ، وجيب أي ارتفاع = بُعد القطر + الأصل × جتا فضل الدائر</text>
