<text x="380.0" y="520.0" font-size="18" fill="#2b1d12" text-anchor="middle" direction="rtl" dominant-baseline="middle">المثلثان أ ب ج و أ د هـ متشابهان: ب ج ⁄ أ ب = د هـ ⁄ أ د = جيب الزاوية ⁄ ٦٠</text>
<text x="380.0" y="550.0" font-size="18" fill="#b0301f" text-anchor="middle" direction="rtl" dominant-baseline="middle">«ضَعْ على الأول، وعَلِّمْ على الثاني، وانقُلْ إلى الثالث، يخرجْ لك الرابع»</text></svg>